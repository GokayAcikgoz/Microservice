services:
  mongo.db.catalog: # catalog microservice db'si
    restart: always # herhangi bir hata durumunda container'i yeniden baslatir
    image: mongo:8.0-rc # kullanilacak image
    container_name: mongo.db.catalog.container # container ismi
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME} # .env dosyasindan cekiliyor
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD} # .env dosyasindan cekiliyor
    ports:
      - "27030:27017" # 27030 host, 27017 container
    volumes:
      - mongo.db.catalog.volume:/data/db

  mongo.db.catalog.ui:
    image: mongo-express:1.0.2-20-alpine3.19
    container_name: mongo.db.catalog.ui.container
    ports:
      - "27032:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongo.db.catalog:27017/
      ME_CONFIG_BASICAUTH: "false"  #mongo ui baglaniynda kullanici adi sifre sormasin

volumes:
  mongo.db.catalog.volume:
